        <!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="shortcut icon" href="./icons/icon-web.png" type="image/x-icon">

<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#6c63ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Agenda" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0f172a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <div class="container">
    <h1>Entrar</h1>

    <input type="email" id="email" placeholder="Seu email">
 <div class="campo-senha">

  <input
    type="password"
    id="senha"
    placeholder="Senha"
    autocomplete="current-password"
  >

  <button
    type="button"
    id="toggleSenha"
    class="btn-toggle-senha"
    aria-label="Mostrar senha"
    title="Mostrar senha"
  >

    <!-- Ícone para mostrar a senha -->
    <svg
      id="iconeMostrarSenha"
      class="icone-senha"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
      ></path>

      <circle
        cx="12"
        cy="12"
        r="3"
      ></circle>
    </svg>

    <!-- Ícone para ocultar a senha -->
    <svg
      id="iconeOcultarSenha"
      class="icone-senha oculto"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M3 3l18 18"
      ></path>

      <path
        d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
      ></path>

      <path
        d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18.6 18.6 0 0 1-2.1 3.2"
      ></path>

      <path
        d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 5.4-1.6"
      ></path>
    </svg>

  </button>

</div>

    <button id="btnLogin">Entrar</button>
    <button id="btnCadastro">Criar conta</button>


    <div class="divider"><span>ou continue com</span></div>

    <button id="btnGoogle">Entrar com Google</button>
  </div>

  <script type="module" src="main.js"></script>
  <script src="./pwa-register.js"></script>
</body>
</html>
