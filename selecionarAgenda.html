<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecionar Agenda</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="./icons/icon-web.png" type="image/x-icon">

  <link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#6c63ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Agenda" />

  <meta name="theme-color" content="#0f172a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <main class="container selecionar-agenda-container">

    <!-- LISTA DAS AGENDAS DO USUÁRIO -->
    <section class="minhas-agendas">

      <h1>Escolha uma agenda</h1>

      <p class="texto-selecao">
        Selecione uma agenda da qual você participa.
      </p>

      <!--
        O JavaScript colocará os cards das agendas
        dentro desta div.
      -->
      <div
        id="listaAgendas"
        class="lista-agendas"
      ></div>

      <!--
        Esta mensagem aparece quando o usuário
        ainda não participa de nenhuma agenda.
      -->
      <p
        id="mensagemSemAgendas"
        class="mensagem-sem-agendas"
        style="display: none;"
      >
        Você ainda não participa de nenhuma agenda.
      </p>

    </section>

    <div class="divider">
      <span>ou</span>
    </div>

    <!-- CRIAR OU ENTRAR EM UMA NOVA AGENDA -->
    <section class="acoes-agenda">

      <div class="bloco-agenda">

        <h2>Criar nova agenda</h2>

        <input
          type="text"
          id="nomeAgenda"
          placeholder="Nome da agenda"
          maxlength="60"
        >

        <button
          type="button"
          id="btnCriar"
        >
          Criar agenda
        </button>

      </div>

      <div class="bloco-agenda">

        <h2>Entrar com código</h2>

        <input
          type="text"
          id="codigo"
          placeholder="Digite o código da agenda"
          maxlength="6"
          autocomplete="off"
        >

        <button
          type="button"
          id="btnEntrar"
        >
          Entrar em uma agenda
        </button>

      </div>

    </section>

  </main>

  <script
    type="module"
    src="./selecionarAgenda.js"
  ></script>

  <script src="./pwa-register.js"></script>

</body>

</html>
